<svg width="1000" height="700" viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="1000" height="700" fill="#f9f9f9"/>
    
    <!-- Title -->
    <text x="500" y="30" text-anchor="middle" fill="#333" font-size="22" font-weight="bold" font-family="Arial, sans-serif">AXI4-Lite Protocol Timing Diagram</text>
    <text x="500" y="55" text-anchor="middle" fill="#666" font-size="14" font-family="Arial, sans-serif">Write Transaction followed by Read Transaction</text>
    
    <!-- Time markers -->
    <text x="100" y="85" fill="#666" font-size="10" font-family="monospace">T0</text>
    <text x="200" y="85" fill="#666" font-size="10" font-family="monospace">T1</text>
    <text x="300" y="85" fill="#666" font-size="10" font-family="monospace">T2</text>
    <text x="400" y="85" fill="#666" font-size="10" font-family="monospace">T3</text>
    <text x="500" y="85" fill="#666" font-size="10" font-family="monospace">T4</text>
    <text x="600" y="85" fill="#666" font-size="10" font-family="monospace">T5</text>
    <text x="700" y="85" fill="#666" font-size="10" font-family="monospace">T6</text>
    <text x="800" y="85" fill="#666" font-size="10" font-family="monospace">T7</text>
    <text x="900" y="85" fill="#666" font-size="10" font-family="monospace">T8</text>
    
    <!-- Vertical time grid -->
    <line x1="100" y1="90" x2="100" y2="650" stroke="#ddd" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="200" y1="90" x2="200" y2="650" stroke="#ddd" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="300" y1="90" x2="300" y2="650" stroke="#ddd" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="400" y1="90" x2="400" y2="650" stroke="#ddd" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="500" y1="90" x2="500" y2="650" stroke="#ddd" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="600" y1="90" x2="600" y2="650" stroke="#ddd" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="700" y1="90" x2="700" y2="650" stroke="#ddd" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="800" y1="90" x2="800" y2="650" stroke="#ddd" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="900" y1="90" x2="900" y2="650" stroke="#ddd" stroke-width="1" stroke-dasharray="5,5"/>
    
    <!-- Clock signal -->
    <text x="30" y="115" fill="#333" font-size="11" font-weight="bold" font-family="Arial, sans-serif">aclk</text>
    <polyline points="100,120 100,100 200,100 200,120 300,120 300,100 400,100 400,120 500,120 500,100 600,100 600,120 700,120 700,100 800,100 800,120 900,120 900,100" 
              fill="none" stroke="#ff6b6b" stroke-width="2"/>
    
    <!-- WRITE TRANSACTION SECTION -->
    <rect x="50" y="140" width="450" height="270" fill="#e3f2fd" fill-opacity="0.3" stroke="#2196f3" stroke-width="2" stroke-dasharray="10,5" rx="5"/>
    <text x="275" y="160" text-anchor="middle" fill="#2196f3" font-size="12" font-weight="bold" font-family="Arial, sans-serif">WRITE TRANSACTION</text>
    
    <!-- AWVALID -->
    <text x="30" y="195" fill="#333" font-size="11" font-weight="bold" font-family="Arial, sans-serif">AWVALID</text>
    <polyline points="100,200 200,200 200,180 400,180 400,200 900,200" fill="none" stroke="#4caf50" stroke-width="2"/>
    
    <!-- AWREADY -->
    <text x="30" y="235" fill="#333" font-size="11" font-weight="bold" font-family="Arial, sans-serif">AWREADY</text>
    <polyline points="100,240 300,240 300,220 400,220 400,240 900,240" fill="none" stroke="#4caf50" stroke-width="2"/>
    
    <!-- AWADDR -->
    <text x="30" y="275" fill="#333" font-size="11" font-weight="bold" font-family="Arial, sans-serif">AWADDR</text>
    <polyline points="100,280 200,280 200,260 400,260 400,280 900,280" fill="none" stroke="#9c27b0" stroke-width="2"/>
    <text x="300" y="255" text-anchor="middle" fill="#9c27b0" font-size="9" font-family="monospace">0x00</text>
    
    <!-- WVALID -->
    <text x="30" y="315" fill="#333" font-size="11" font-weight="bold" font-family="Arial, sans-serif">WVALID</text>
    <polyline points="100,320 200,320 200,300 400,300 400,320 900,320" fill="none" stroke="#4caf50" stroke-width="2"/>
    
    <!-- WREADY -->
    <text x="30" y="355" fill="#333" font-size="11" font-weight="bold" font-family="Arial, sans-serif">WREADY</text>
    <polyline points="100,360 300,360 300,340 400,340 400,360 900,360" fill="none" stroke="#4caf50" stroke-width="2"/>
    
    <!-- WDATA -->
    <text x="30" y="395" fill="#333" font-size="11" font-weight="bold" font-family="Arial, sans-serif">WDATA</text>
    <polyline points="100,400 200,400 200,380 400,380 400,400 900,400" fill="none" stroke="#9c27b0" stroke-width="2"/>
    <text x="300" y="375" text-anchor="middle" fill="#9c27b0" font-size="9" font-family="monospace">0x1234ABCD</text>
    
    <!-- BVALID -->
    <text x="30" y="435" fill="#333" font-size="11" font-weight="bold" font-family="Arial, sans-serif">BVALID</text>
    <polyline points="100,440 400,440 400,420 500,420 500,440 900,440" fill="none" stroke="#ff9800" stroke-width="2"/>
    
    <!-- BREADY -->
    <text x="30" y="475" fill="#333" font-size="11" font-weight="bold" font-family="Arial, sans-serif">BREADY</text>
    <polyline points="100,480 200,480 200,460 500,460 500,480 900,480" fill="none" stroke="#ff9800" stroke-width="2"/>
    
    <!-- BRESP -->
    <text x="30" y="515" fill="#333" font-size="11" font-weight="bold" font-family="Arial, sans-serif">BRESP</text>
    <polyline points="100,520 400,520 400,500 500,500 500,520 900,520" fill="none" stroke="#e91e63" stroke-width="2"/>
    <text x="450" y="495" text-anchor="middle" fill="#e91e63" font-size="9" font-family="monospace">OKAY</text>
    
    <!-- READ TRANSACTION SECTION -->
    <rect x="500" y="140" width="400" height="220" fill="#fff3e0" fill-opacity="0.3" stroke="#ff9800" stroke-width="2" stroke-dasharray="10,5" rx="5"/>
    <text x="700" y="160" text-anchor="middle" fill="#ff9800" font-size="12" font-weight="bold" font-family="Arial, sans-serif">READ TRANSACTION</text>
    
    <!-- ARVALID -->
    <text x="30" y="555" fill="#333" font-size="11" font-weight="bold" font-family="Arial, sans-serif">ARVALID</text>
    <polyline points="100,560 600,560 600,540 700,540 700,560 900,560" fill="none" stroke="#2196f3" stroke-width="2"/>
    
    <!-- ARREADY -->
    <text x="30" y="595" fill="#333" font-size="11" font-weight="bold" font-family="Arial, sans-serif">ARREADY</text>
    <polyline points="100,600 600,600 600,580 700,580 700,600 900,600" fill="none" stroke="#2196f3" stroke-width="2"/>
    
    <!-- ARADDR -->
    <text x="30" y="635" fill="#333" font-size="11" font-weight="bold" font-family="Arial, sans-serif">ARADDR</text>
    <polyline points="100,640 600,640 600,620 700,620 700,640 900,640" fill="none" stroke="#9c27b0" stroke-width="2"/>
    <text x="650" y="615" text-anchor="middle" fill="#9c27b0" font-size="9" font-family="monospace">0x00</text>
    
    <!-- RVALID (off diagram, continuing) -->
    <text x="30" y="675" fill="#333" font-size="11" font-weight="bold" font-family="Arial, sans-serif">RVALID</text>
    <polyline points="100,680 700,680 700,660 800,660 800,680 900,680" fill="none" stroke="#00bcd4" stroke-width="2"/>
    
    <!-- Handshake indicators -->
    <circle cx="300" cy="210" r="5" fill="#4caf50" opacity="0.7"/>
    <text x="300" y="225" text-anchor="middle" fill="#4caf50" font-size="8" font-family="Arial, sans-serif">AW Handshake</text>
    
    <circle cx="300" cy="330" r="5" fill="#4caf50" opacity="0.7"/>
    <text x="300" y="345" text-anchor="middle" fill="#4caf50" font-size="8" font-family="Arial, sans-serif">W Handshake</text>
    
    <circle cx="450" cy="450" r="5" fill="#ff9800" opacity="0.7"/>
    <text x="450" y="465" text-anchor="middle" fill="#ff9800" font-size="8" font-family="Arial, sans-serif">B Handshake</text>
    
    <circle cx="650" cy="570" r="5" fill="#2196f3" opacity="0.7"/>
    <text x="650" y="585" text-anchor="middle" fill="#2196f3" font-size="8" font-family="Arial, sans-serif">AR Handshake</text>
    
    <!-- Legend -->
    <rect x="50" y="690" width="900" height="10" fill="none"/>
    <line x1="60" y1="695" x2="90" y2="695" stroke="#4caf50" stroke-width="2"/>
    <text x="95" y="698" fill="#333" font-size="9" font-family="Arial, sans-serif">Valid/Ready Signals</text>
    
    <line x1="220" y1="695" x2="250" y2="695" stroke="#9c27b0" stroke-width="2"/>
    <text x="255" y="698" fill="#333" font-size="9" font-family="Arial, sans-serif">Address/Data</text>
    
    <line x1="360" y1="695" x2="390" y2="695" stroke="#e91e63" stroke-width="2"/>
    <text x="395" y="698" fill="#333" font-size="9" font-family="Arial, sans-serif">Response</text>
    
    <text x="500" y="698" fill="#666" font-size="8" font-style="italic" font-family="Arial, sans-serif">Note: Handshake occurs when both VALID and READY are high on rising clock edge</text>
</svg>